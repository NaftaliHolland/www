{% extends "base.html" %}
{% load wagtailcore_tags %}
{% block content %}
<article class="max-w-site mx-auto px-6 md:px-10 pt-16 pb-24">
  <h1 class="font-display text-4xl md:text-5xl tracking-tight max-w-2xl mb-6">{{ page.title }}</h1>
  <p class="text-inksoft text-lg max-w-2xl leading-relaxed mb-8">{{ page.summary }}</p>
  {% if page.body %}
  <div class="richtext max-w-2xl text-inksoft leading-relaxed">{{ page.body|richtext }}</div>
  {% else %}
  <p class="text-muted italic">The full write-up isn't published yet — check back soon.</p>
  {% endif %}
</article>
{% endblock %}
